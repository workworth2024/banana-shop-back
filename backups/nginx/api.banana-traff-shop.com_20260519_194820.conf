server {
    listen 80;
    server_name api.banana-traff-shop.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://api.banana-traff-shop.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.banana-traff-shop.com;

    ssl_certificate /etc/letsencrypt/live/api.banana-traff-shop.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.banana-traff-shop.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    limit_conn conn_limit 30;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # CryptoCloud postback — public, no rate limit, generous timeouts, no body parsing tweaks
    location = /api/v3/cryptocloud/postback {
        access_log /var/log/nginx/cryptocloud_postback.log;
        proxy_pass http://banana_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 256k;
    }

    location = /api/v3/cryptocloud/postback-test {
        access_log /var/log/nginx/cryptocloud_postback.log;
        proxy_pass http://banana_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 256k;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        limit_req_status 429;

        proxy_pass http://banana_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        client_max_body_size 50m;
    }

    location / {
        return 404;
    }
}
